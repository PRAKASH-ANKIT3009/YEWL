<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Admin Login</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            background: white;

            width: 400px;
            max-width: 90%;

            padding: 35px;

            border-radius: 15px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        input {
            width: 100%;

            padding: 14px;

            margin-bottom: 15px;

            border: 1px solid #ddd;

            border-radius: 8px;

            font-size: 16px;
        }

        button {
            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 8px;

            background: #ff8c1a;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        #message {
            margin-top: 15px;

            text-align: center;

            font-weight: bold;
        }

    </style>

</head>

<body>

    <div class="login-box">

        <h1>🔐 Admin Login</h1>

        <form id="login-form">

            <input
                type="text"
                id="username"
                placeholder="Username"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <p id="message"></p>

    </div>


    <script>

        const loginForm =
            document.getElementById("login-form");

        const message =
            document.getElementById("message");


        loginForm.addEventListener(
            "submit",
            async function (e) {

                e.preventDefault();

                const username =
                    document.getElementById("username").value;

                const password =
                    document.getElementById("password").value;


                try {

                    const response = await fetch(
                        "http://localhost:5000/api/admin/login",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type": "application/json"
                            },

                            body: JSON.stringify({
                                username,
                                password
                            })
                        }
                    );


                    const data =
                        await response.json();


                    if (!data.success) {

                        message.textContent =
                            "❌ " + data.message;

                        return;
                    }


                    // Save login token
                    localStorage.setItem(
                        "adminToken",
                        data.token
                    );


                    // Open dashboard
                    window.location.href =
                        "admin.html";

                } catch (error) {

                    console.error(error);

                    message.textContent =
                        "❌ Unable to connect to server.";
                }

            }
        );

    </script>

</body>

</html>
