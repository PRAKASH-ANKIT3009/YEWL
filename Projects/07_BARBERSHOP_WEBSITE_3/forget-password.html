<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NOORSLOT - Forgot Password</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f7f7;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        .forgot-card {
            width: 100%;
            max-width: 430px;

            background: #fff;

            padding: 32px;

            border-radius: 18px;

            box-shadow:
                0 10px 35px rgba(0,0,0,0.10);
        }

        .logo {
            text-align: center;
            font-size: 30px;
            font-weight: 800;
            letter-spacing: 2px;
        }

        .tagline {
            text-align: center;
            color: #777;
            font-size: 13px;
            margin-top: 8px;
            margin-bottom: 30px;
        }

        h2 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 13px 14px;

            border: 1px solid #ddd;
            border-radius: 9px;

            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #111;
        }

        button {
            width: 100%;
            padding: 14px;

            margin-top: 18px;

            border: none;
            border-radius: 9px;

            background: #111;
            color: #fff;

            font-size: 16px;
            font-weight: 600;

            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            margin-top: 18px;
            text-align: center;
            font-size: 14px;
            line-height: 1.5;
        }

        .back-login {
            margin-top: 22px;
            text-align: center;
        }

        .back-login a {
            color: #111;
            font-weight: 600;
            text-decoration: none;
        }

    </style>

</head>


<body>


<div class="forgot-card">


    <div class="logo">
        NOORSLOT
    </div>


    <div class="tagline">
        FIND. BOOK. GROOM.
    </div>


    <h2>
        Forgot Password?
    </h2>


    <p class="subtitle">
        Enter your registered email address and
        we'll send you a password reset link.
    </p>


    <form id="forgotPasswordForm">


        <label for="email">
            Email Address
        </label>


        <input
            type="email"
            id="email"
            placeholder="Enter your registered email"
            autocomplete="email"
            required
        >


        <button
            type="submit"
            id="submitButton"
        >
            Send Reset Link
        </button>


    </form>


    <div id="message"></div>


    <div class="back-login">

        <a href="customer-login.html">
            ← Back to Login
        </a>

    </div>


</div>


<script>

const API_BASE_URL =
    "https://yewl.onrender.com";


const form =
    document.getElementById(
        "forgotPasswordForm"
    );


const button =
    document.getElementById(
        "submitButton"
    );


const message =
    document.getElementById(
        "message"
    );


const params =
    new URLSearchParams(
        window.location.search
    );


const accountType =
    params.get("type") === "provider"
        ? "provider"
        : "customer";


form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const email =
            document
                .getElementById("email")
                .value
                .trim()
                .toLowerCase();


        message.textContent =
            "Sending reset link...";

        message.style.color =
            "#555";


        button.disabled =
            true;


        try {

            const response =
                await fetch(
                    `${API_BASE_URL}/api/auth/forgot-password`,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            email,
                            accountType
                        })
                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    data.message ||
                    "Unable to process request."
                );

            }


            message.textContent =
                "If an account exists with this email, a password reset link has been sent.";

            message.style.color =
                "green";


            form.reset();


        } catch (error) {

            console.error(
                "Forgot password error:",
                error
            );


            message.textContent =
                error.message ||
                "Unable to send reset link.";

            message.style.color =
                "#d93025";


        } finally {

            button.disabled =
                false;

        }

    }
);

</script>


</body>

</html>
