<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Find Professionals | NOORSLOT</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f7f7f7;
            color: #222;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: auto;
        }

        header {
            padding: 25px 0;
            background: white;
            border-bottom: 1px solid #eee;
            text-align: center;
        }

        .logo {
            font-size: 28px;
            font-weight: 700;
            text-align: center;
        }

        .hero {
            padding: 45px 0 25px;
            text-align: center;
        }

        .providers-heading {
            width: 100%;
            text-align: center;
            margin: 0 auto;
        }

        .hero h1 {
            font-size: 36px;
            margin-bottom: 10px;
            text-align: center;
        }

        .hero p {
            color: #777;
            text-align: center;
        }

        .filters {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin: 20px 0 30px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .filter-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
        }

        .filter-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: white;
        }

        .providers-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
            padding-bottom: 50px;
        }

        .provider-card {
            background: white;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .provider-image {
            width: 100%;
            height: 220px;
            object-fit: cover;
            background: #eee;
        }

        .provider-content {
            padding: 18px;
        }

        .provider-content h2 {
            font-size: 21px;
            margin-bottom: 8px;
        }

        .category {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            background: #f0f0f0;
            font-size: 13px;
            margin-bottom: 12px;
        }

        .provider-info {
            color: #666;
            line-height: 1.8;
            margin-bottom: 15px;
        }

        .view-profile {
            display: block;
            width: 100%;
            text-align: center;
            padding: 12px;
            background: #111;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        .view-profile:hover {
            opacity: 0.85;
        }

        .message {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px;
            color: #777;
        }

        /* =========================================
   NOORSLOT ADVANCED FILTERS
========================================= */

.filters {
    width: min(1100px, calc(100% - 40px));
    margin: 30px auto 40px;

    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 16px;

    align-items: end;

    padding: 22px;

    background: rgba(255, 255, 255, 0.97);

    border: 1px solid rgba(0, 0, 0, 0.08);
    border-radius: 18px;

    box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.07);

    box-sizing: border-box;
}


/* =========================================
   FILTER GROUP
========================================= */

.filter-group {
    display: flex;
    flex-direction: column;
    gap: 7px;
}

.filter-group label {
    font-size: 13px;
    font-weight: 600;
    color: #333;
}


/* =========================================
   SELECT
========================================= */

.filter-group select {
    width: 100%;
    height: 46px;

    padding: 0 35px 0 14px;

    border: 1px solid #ddd;
    border-radius: 12px;

    background: #fff;
    color: #222;

    font-size: 14px;
    font-weight: 500;

    outline: none;
    cursor: pointer;

    transition: all 0.25s ease;

    box-sizing: border-box;
}

.filter-group select:hover {
    border-color: #999;
}

.filter-group select:focus {
    border-color: #222;

    box-shadow:
        0 0 0 3px rgba(0, 0, 0, 0.06);
}


/* =========================================
   RESET BUTTON
========================================= */

.filter-reset {
    justify-content: flex-end;
}

.reset-filter-btn {
    width: 100%;
    height: 46px;

    border: none;
    border-radius: 12px;

    background: #222;
    color: #fff;

    font-size: 14px;
    font-weight: 600;

    cursor: pointer;

    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;

    transition:
        transform 0.25s ease,
        background 0.25s ease,
        box-shadow 0.25s ease;
}

.reset-filter-btn:hover {
    background: #000;

    transform: translateY(-2px);

    box-shadow:
        0 8px 18px rgba(0, 0, 0, 0.18);
}

.reset-filter-btn:active {
    transform: translateY(0);
}


/* =========================================
   TABLET
========================================= */

@media screen and (max-width: 1000px) {

    .filters {
        width: min(750px, calc(100% - 30px));

        grid-template-columns: repeat(3, 1fr);
    }

}


/* =========================================
   MOBILE
========================================= */

@media screen and (max-width: 600px) {

    .filters {
        width: calc(100% - 24px);

        grid-template-columns: 1fr;

        padding: 18px;

        margin: 20px auto 30px;

        border-radius: 16px;
    }

    .filter-group select,
    .reset-filter-btn {
        height: 48px;
    }

}
        @media (max-width: 900px) {
            .providers-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .filters {
                grid-template-columns: 1fr;
            }

            .providers-grid {
                grid-template-columns: 1fr;
            }

            .hero h1 {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="container">
            <div class="logo">NOORSLOT</div>
        </div>
    </header>

    <main>

        <section class="hero container">

            <div class="providers-heading">

                <h1>Find Your Professional</h1>

                <p>
                    Choose a barber or beauty professional near you.
                </p>

            </div>

        </section>


        <section class="filters container">

            <!-- Category -->
            <div class="filter-group">

                <label for="categoryFilter">
                    Category
                </label>

                <select id="categoryFilter">

                    <option value="">
                        All Categories
                    </option>

                    <option value="barber">
                        Barber
                    </option>

                    <option value="beauty">
                        Beauty / Makeup
                    </option>

                </select>

            </div>


            <!-- Area -->
            <div class="filter-group">

                <label for="areaFilter">
                    Area
                </label>

                <select id="areaFilter">

                    <option value="">
                        All Areas
                    </option>

                </select>

            </div>


            <!-- Account Type -->
            <div class="filter-group">

                <label for="accountTypeFilter">
                    Professional Type
                </label>

                <select id="accountTypeFilter">

                    <option value="">
                        All Professionals
                    </option>

                    <option value="individual">
                        Individual
                    </option>

                    <option value="shop">
                        Shop
                    </option>

                </select>

            </div>


            <!-- Minimum Price -->
            <div class="filter-group">

                <label for="minPriceFilter">
                    Minimum Price
                </label>

                <select id="minPriceFilter">

                    <option value="">
                        Any Price
                    </option>

                    <option value="100">
                        ₹100+
                    </option>

                    <option value="300">
                        ₹300+
                    </option>

                    <option value="500">
                        ₹500+
                    </option>

                    <option value="1000">
                        ₹1000+
                    </option>

                </select>

            </div>


            <!-- Maximum Price -->
            <div class="filter-group">

                <label for="maxPriceFilter">
                    Maximum Price
                </label>

                <select id="maxPriceFilter">

                    <option value="">
                        Any Price
                    </option>

                    <option value="300">
                        Up to ₹300
                    </option>

                    <option value="500">
                        Up to ₹500
                    </option>

                    <option value="1000">
                        Up to ₹1000
                    </option>

                    <option value="2000">
                        Up to ₹2000
                    </option>

                </select>

            </div>


            <!-- Sort -->
            <div class="filter-group">

                <label for="sortFilter">
                    Sort By
                </label>

                <select id="sortFilter">

                    <option value="">
                        Recommended
                    </option>

                    <option value="price-low">
                        Price: Low to High
                    </option>

                    <option value="price-high">
                        Price: High to Low
                    </option>

                    <option value="rating">
                        Highest Rated
                    </option>

                    <option value="name">
                        Name: A to Z
                    </option>

                </select>

            </div>


            <!-- Reset -->
            <div class="filter-group filter-reset">

                <label>
                    &nbsp;
                </label>

                <button
                    type="button"
                    id="resetFilters"
                    class="reset-filter-btn"
                >
                    <span>↻</span>

                    Reset Filters
                </button>

            </div>

        </section>


        <section class="providers-grid container"
                 id="providersGrid">

            <div class="message">
                Loading professionals...
            </div>

        </section>

    </main>


    <script>

        const API_BASE_URL = "https://yewl.onrender.com";


        const providersGrid =
            document.getElementById("providersGrid");


        const categoryFilter =
            document.getElementById("categoryFilter");


        const areaFilter =
            document.getElementById("areaFilter");

        const accountTypeFilter =
            document.getElementById("accountTypeFilter");

        const minPriceFilter =
            document.getElementById("minPriceFilter");

        const maxPriceFilter =
            document.getElementById("maxPriceFilter");

        const sortFilter =
            document.getElementById("sortFilter");

        const resetFilters =
            document.getElementById("resetFilters");


        let allProviders = [];


        // ===============================
        // LOAD PROVIDERS
        // ===============================

        async function loadProviders() {

            try {

                const response = await fetch(
                    `${API_BASE_URL}/api/public/providers`
                );


                const data =
                    await response.json();


                console.log(
                    "Public providers:",
                    data
                );


                if (!data.success) {

                    providersGrid.innerHTML = `
                        <div class="message">
                            Failed to load professionals.
                        </div>
                    `;

                    return;
                }


                allProviders =
                    data.providers || [];


                createAreaOptions();


                displayProviders(
                    allProviders
                );


            } catch (error) {

                console.error(
                    "Load providers error:",
                    error
                );


                providersGrid.innerHTML = `
                    <div class="message">
                        Unable to connect to server.
                    </div>
                `;

            }

        }


        // ===============================
        // CREATE AREA OPTIONS
        // ===============================

        function createAreaOptions() {

            const areas =
                [
                    ...new Set(
                        allProviders
                            .map(provider => provider.area)
                            .filter(Boolean)
                    )
                ];


            areas.sort();


            areas.forEach(area => {

                const option =
                    document.createElement("option");


                option.value = area;


                option.textContent = area;


                areaFilter.appendChild(option);

            });

        }


        // ===============================
        // DISPLAY PROVIDERS
        // ===============================

        function displayProviders(
            providers
        ) {

            providersGrid.innerHTML = "";


            if (!providers.length) {

                providersGrid.innerHTML = `
                    <div class="message">
                        No professionals found.
                    </div>
                `;

                return;
            }


            providers.forEach(provider => {

                const card =
                    document.createElement("div");


                card.className =
                    "provider-card";


                const image =
                    provider.profileImage ||
                    "assets/img/default-provider.jpg";


                const category =
                    provider.category === "beauty"
                        ? "Beauty / Makeup"
                        : "Barber";


                const accountType =
                    provider.accountType === "shop"
                        ? "Shop"
                        : "Individual";


                card.innerHTML = `

                    <img
                        class="provider-image"
                        src="${image}"
                        alt="${provider.name || "Professional"}"
                        onerror="this.src='assets/img/default-provider.jpg'"
                    >

                    <div class="provider-content">

                        <h2>
                            ${provider.name || "Unnamed Professional"}
                        </h2>

                        <span class="category">
                            ${category}
                        </span>

                        <div class="provider-info">

                            📍 ${provider.area || "Location not available"}
                            <br>

                            👤 ${accountType}

                        </div>

                        <a
                            class="view-profile"
                            href="provider-profile.html?providerId=${provider._id}"
                        >
                            View Profile
                        </a>

                    </div>

                `;


                providersGrid.appendChild(card);

            });

        }


        // ===============================
        // FILTER PROVIDERS
        // ===============================

        function filterProviders() {

            const selectedCategory =
                categoryFilter.value.toLowerCase();

            const selectedArea =
                areaFilter.value.toLowerCase();

            const selectedAccountType =
                accountTypeFilter.value.toLowerCase();

            const minPrice =
                minPriceFilter.value
                    ? Number(minPriceFilter.value)
                    : 0;

            const maxPrice =
                maxPriceFilter.value
                    ? Number(maxPriceFilter.value)
                    : Infinity;

            let filteredProviders =
                allProviders.filter(function (provider) {

                    // =========================
                    // CATEGORY FILTER
                    // =========================

                    const providerCategory =
                        (provider.category || "")
                            .toLowerCase();

                    if (
                        selectedCategory &&
                        providerCategory !== selectedCategory
                    ) {
                        return false;
                    }


                    // =========================
                    // AREA FILTER
                    // =========================

                    const providerArea =
                        (provider.area || "")
                            .toLowerCase();

                    if (
                        selectedArea &&
                        providerArea !== selectedArea
                    ) {
                        return false;
                    }


                    // =========================
                    // ACCOUNT TYPE FILTER
                    // =========================

                    const providerAccountType =
                        (provider.accountType || "")
                            .toLowerCase();

                    if (
                        selectedAccountType &&
                        providerAccountType !== selectedAccountType
                    ) {
                        return false;
                    }


                    // =========================
                    // PRICE FILTER
                    // =========================

                    const providerPrice =
                        Number(provider.startingPrice || 0);

                    if (
                        providerPrice < minPrice ||
                        providerPrice > maxPrice
                    ) {
                        return false;
                    }


                    return true;

                });


            // =========================
            // SORTING
            // =========================

            const selectedSort =
                sortFilter.value;


            if (selectedSort === "price-low") {

                filteredProviders.sort(function (a, b) {

                    return (
                        Number(a.startingPrice || 0) -
                        Number(b.startingPrice || 0)
                    );

                });

            }


            else if (selectedSort === "price-high") {

                filteredProviders.sort(function (a, b) {

                    return (
                        Number(b.startingPrice || 0) -
                        Number(a.startingPrice || 0)
                    );

                });

            }


            else if (selectedSort === "rating") {
        
                filteredProviders.sort(function (a, b) {

                    return (
                        Number(b.rating || 0) -
                        Number(a.rating || 0)
                    );

                });

            }


            else if (selectedSort === "name") {

                filteredProviders.sort(function (a, b) {

                    return (
                        (a.name || "")
                            .localeCompare(
                                b.name || ""
                            )
                    );

                });

            }


            // =========================
            // DISPLAY PROVIDERS
            // =========================

            displayProviders(filteredProviders);

        }


        // ===============================
        // FILTER EVENTS
        // ===============================

        categoryFilter.addEventListener(
            "change",
            filterProviders
        );

        areaFilter.addEventListener(
            "change",
            filterProviders
        );

        accountTypeFilter.addEventListener(
            "change",
            filterProviders
        );

        minPriceFilter.addEventListener(
            "change",
            filterProviders
        );

        maxPriceFilter.addEventListener(
            "change",
            filterProviders
        );

        sortFilter.addEventListener(
            "change",
            filterProviders
        );


        resetFilters.addEventListener(
            "click",
            function () {

                categoryFilter.value = "";

                areaFilter.value = "";

                accountTypeFilter.value = "";

                minPriceFilter.value = "";

                maxPriceFilter.value = "";

                sortFilter.value = "";

                filterProviders();

            }
        );


        // START

        loadProviders();

    </script>

</body>

</html>
