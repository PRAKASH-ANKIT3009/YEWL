<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NOORSLOT Admin Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            padding: 40px;
            background: #f5f5f5;
        }

        h1 {
            margin-bottom: 30px;
        }

        .table-container {
            overflow-x: auto;
            background: #fff;
            padding: 20px;
            border-radius: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background: #222;
            color: #fff;
        }

        .loading {
            margin-bottom: 20px;
        }

        .delete-btn {
            padding: 8px 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background: #e53935;
            color: #fff;
            font-weight: bold;
        }

        .delete-btn:hover {
            opacity: 0.8;
        }

        #logout-btn {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            background: #222;
            color: #fff;
            cursor: pointer;
            margin-bottom: 25px;
        }

        #logout-btn:hover {
            opacity: 0.8;
        }

        .dashboard-stats {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .stat-card {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            min-width: 180px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .stat-card h3 {
            margin-bottom: 10px;
            font-size: 16px;
        }

        .stat-card p {
            font-size: 28px;
            font-weight: bold;
        }

        .filters {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .filters input,
        .filters select,
        .filters button {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        #clear-filters {
            background: #222;
            color: #fff;
            border: none;
            cursor: pointer;
        }

        #clear-filters:hover {
            opacity: 0.8;
        }

        @media (max-width: 768px) {
            body {
                padding: 20px;
            }

            .filters {
                flex-direction: column;
            }

            .filters input,
            .filters select,
            .filters button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <h1>📅 NOORSLOT Booking Dashboard</h1>

    <button id="logout-btn">Logout</button>

    <!-- DASHBOARD STATS -->
    <div class="dashboard-stats">

        <div class="stat-card">
            <h3>Total Bookings</h3>
            <p id="total-bookings">0</p>
        </div>

        <div class="stat-card">
            <h3>Today's Bookings</h3>
            <p id="today-bookings">0</p>
        </div>

    </div>

    <!-- FILTERS -->
    <div class="filters">

        <input
            type="text"
            id="search-booking"
            placeholder="Search customer name..."
        >

        <input
            type="date"
            id="filter-date"
        >

        <select id="filter-provider">
            <option value="">All Providers</option>
        </select>

        <select id="filter-status">
            <option value="">All Statuses</option>
            <option value="Pending">Pending</option>
            <option value="Confirmed">Confirmed</option>
            <option value="Completed">Completed</option>
            <option value="Cancelled">Cancelled</option>
        </select>

        <button id="clear-filters">
            Clear Filters
        </button>

    </div>

    <p class="loading" id="loading">
        Loading bookings...
    </p>

    <div class="table-container">

        <table>

            <thead>
                <tr>
                    <th>Customer</th>
                    <th>Phone</th>
                    <th>Service</th>
                    <th>Barber</th>
                    <th>Date</th>
                    <th>Time</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="booking-list"></tbody>

        </table>

    </div>

    <script>
        // Store all bookings
        let allBookings = [];

        // =========================
        // LOAD BOOKINGS
        // =========================

        async function loadBookings() {
            try {
                const token = localStorage.getItem("adminToken");

                if (!token) {
                    window.location.href = "admin-login.html";
                    return;
                }

                const response = await fetch(
                    "https://yewl.onrender.com/api/admin/bookings",
                    {
                        headers: {
                            Authorization: `Bearer ${token}`
                        }
                    }
                );

                const data = await response.json();

                // Session expired
                if (response.status === 401) {
                    localStorage.removeItem("adminToken");

                    alert(
                        "Your admin session has expired. Please login again."
                    );

                    window.location.href = "admin-login.html";
                    return;
                }

                const loading = document.getElementById("loading");

                if (!data.success) {
                    if (loading) {
                        loading.textContent = "Failed to load bookings.";
                    }
                    return;
                }

                // Save all bookings
                allBookings = data.bookings || [];

                // Update statistics
                updateStats(allBookings);

                // Populate provider filter
                populateProviderFilter(allBookings);

                // Display bookings
                displayBookings(allBookings);

            } catch (error) {
                console.error("Load bookings error:", error);

                const loading = document.getElementById("loading");

                if (loading) {
                    loading.textContent = "Unable to connect to backend.";
                }
            }
        }

        // =========================
        // POPULATE PROVIDER FILTER
        // =========================

        function populateProviderFilter(bookings) {
            const providerFilter =
                document.getElementById("filter-provider");

            if (!providerFilter) return;

            const providers = [
                ...new Set(
                    bookings
                        .map(booking => booking.barber)
                        .filter(Boolean)
                )
            ];

            providerFilter.innerHTML =
                '<option value="">All Providers</option>';

            providers.forEach(provider => {
                const option = document.createElement("option");

                option.value = provider;
                option.textContent = provider;

                providerFilter.appendChild(option);
            });
        }

        // =========================
        // DISPLAY BOOKINGS
        // =========================

        function displayBookings(bookings) {
            const bookingList =
                document.getElementById("booking-list");

            const loading =
                document.getElementById("loading");

            bookingList.innerHTML = "";

            if (bookings.length === 0) {
                bookingList.innerHTML = `
                    <tr>
                        <td colspan="8" style="text-align: center;">
                            No bookings found.
                        </td>
                    </tr>
                `;

                if (loading) {
                    loading.textContent = "0 booking(s) found";
                }

                return;
            }

            bookings.forEach(booking => {
                const row = document.createElement("tr");

                const currentStatus =
                    booking.status || "Pending";

                row.innerHTML = `
                    <td>${booking.customerName || ""}</td>

                    <td>${booking.phone || ""}</td>

                    <td>${booking.service || ""}</td>

                    <td>${booking.barber || ""}</td>

                    <td>${booking.date || ""}</td>

                    <td>${booking.time || ""}</td>

                    <td>
                        <select
                            onchange="updateBookingStatus(
                                '${booking._id}',
                                this.value
                            )"
                        >
                            ${[
                                "Pending",
                                "Confirmed",
                                "Completed",
                                "Cancelled"
                            ]
                                .map(
                                    status => `
                                        <option
                                            value="${status}"
                                            ${currentStatus === status
                                                ? "selected"
                                                : ""}
                                        >
                                            ${status}
                                        </option>
                                    `
                                )
                                .join("")}
                        </select>
                    </td>

                    <td>
                        <button
                            class="delete-btn"
                            onclick="deleteBooking('${booking._id}')"
                        >
                            Delete
                        </button>
                    </td>
                `;

                bookingList.appendChild(row);
            });

            if (loading) {
                loading.textContent =
                    `${bookings.length} booking(s) found`;
            }
        }

        // =========================
        // UPDATE STATISTICS
        // =========================

        function updateStats(bookings) {
            const totalElem =
                document.getElementById("total-bookings");

            if (totalElem) {
                totalElem.textContent = bookings.length;
            }

            const today =
                new Date().toISOString().split("T")[0];

            const todayBookings = bookings.filter(
                booking => booking.date === today
            );

            const todayElem =
                document.getElementById("today-bookings");

            if (todayElem) {
                todayElem.textContent =
                    todayBookings.length;
            }
        }

        // =========================
        // SEARCH + FILTER
        // =========================

        function applyFilters() {
            const searchText =
                (
                    document.getElementById("search-booking")?.value ||
                    ""
                )
                    .toLowerCase()
                    .trim();

            const selectedDate =
                document.getElementById("filter-date")?.value || "";

            const selectedProvider =
                (
                    document.getElementById("filter-provider")?.value ||
                    ""
                )
                    .toLowerCase()
                    .trim();

            const selectedStatus =
                document.getElementById("filter-status")?.value || "";

            const filteredBookings =
                allBookings.filter(booking => {

                    // Search by customer name
                    const customerName =
                        (booking.customerName || "").toLowerCase();

                    const matchesSearch =
                        customerName.includes(searchText);

                    // Filter by date
                    const matchesDate =
                        !selectedDate ||
                        booking.date === selectedDate;

                    // Filter by provider
                    const providerName =
                        (booking.barber || "").toLowerCase();

                    const matchesProvider =
                        !selectedProvider ||
                        providerName.includes(selectedProvider);

                    // Filter by status
                    const matchesStatus =
                        !selectedStatus ||
                        (booking.status || "Pending") ===
                            selectedStatus;

                    return (
                        matchesSearch &&
                        matchesDate &&
                        matchesProvider &&
                        matchesStatus
                    );
                });

            displayBookings(filteredBookings);
        }

        // =========================
        // EVENT LISTENERS
        // =========================

        document
            .getElementById("search-booking")
            ?.addEventListener("input", applyFilters);

        document
            .getElementById("filter-date")
            ?.addEventListener("change", applyFilters);

        document
            .getElementById("filter-provider")
            ?.addEventListener("change", applyFilters);

        document
            .getElementById("filter-status")
            ?.addEventListener("change", applyFilters);

        // =========================
        // CLEAR FILTERS
        // =========================

        document
            .getElementById("clear-filters")
            ?.addEventListener("click", () => {

                const searchInput =
                    document.getElementById("search-booking");

                const dateInput =
                    document.getElementById("filter-date");

                const providerInput =
                    document.getElementById("filter-provider");

                const statusInput =
                    document.getElementById("filter-status");

                if (searchInput) {
                    searchInput.value = "";
                }

                if (dateInput) {
                    dateInput.value = "";
                }

                if (providerInput) {
                    providerInput.value = "";
                }

                if (statusInput) {
                    statusInput.value = "";
                }

                displayBookings(allBookings);
            });

        // =========================
        // DELETE BOOKING
        // =========================

        async function deleteBooking(id) {
            const confirmDelete = confirm(
                "Are you sure you want to cancel this booking?"
            );

            if (!confirmDelete) return;

            try {
                const token =
                    localStorage.getItem("adminToken");

                const response = await fetch(
                    `https://yewl.onrender.com/api/admin/bookings/${id}`,
                    {
                        method: "DELETE",
                        headers: {
                            Authorization: `Bearer ${token}`
                        }
                    }
                );

                const data = await response.json();

                if (response.status === 401) {
                    localStorage.removeItem("adminToken");

                    alert(
                        "Your admin session has expired. Please login again."
                    );

                    window.location.href = "admin-login.html";
                    return;
                }

                if (data.success) {
                    alert("Booking cancelled successfully!");
                    loadBookings();
                } else {
                    alert(
                        data.message ||
                        "Failed to delete booking."
                    );
                }

            } catch (error) {
                console.error("Delete error:", error);
                alert("Unable to delete booking.");
            }
        }

        // =========================
        // UPDATE BOOKING STATUS
        // =========================

        async function updateBookingStatus(id, status) {
            try {
                const token =
                    localStorage.getItem("adminToken");

                const response = await fetch(
                    `https://yewl.onrender.com/api/admin/bookings/${id}/status`,
                    {
                        method: "PATCH",
                        headers: {
                            "Content-Type": "application/json",
                            Authorization: `Bearer ${token}`
                        },
                        body: JSON.stringify({
                            status: status
                        })
                    }
                );

                const data = await response.json();

                if (response.status === 401) {
                    localStorage.removeItem("adminToken");

                    alert(
                        "Your admin session has expired. Please login again."
                    );

                    window.location.href = "admin-login.html";
                    return;
                }

                if (!response.ok || !data.success) {
                    throw new Error(
                        data.message ||
                        "Unable to update status"
                    );
                }

                loadBookings();

            } catch (error) {
                console.error(
                    "Status update error:",
                    error
                );

                alert(error.message);
                loadBookings();
            }
        }

        // =========================
        // LOGOUT
        // =========================

        document
            .getElementById("logout-btn")
            ?.addEventListener("click", () => {

                localStorage.removeItem("adminToken");

                window.location.href =
                    "admin-login.html";
            });

        // =========================
        // START DASHBOARD
        // =========================

        loadBookings();
    </script>

</body>

</html>
```
