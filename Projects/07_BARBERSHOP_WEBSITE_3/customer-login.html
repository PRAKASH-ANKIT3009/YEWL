<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NOORSLOT - Customer Login</title>

    <link
        rel="stylesheet"
        href="assets/css/styles.css"
    >

    <style>

        .customer-auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 16px;
            background: #f7f7f7;
        }

        .customer-auth-card {
            width: 100%;
            max-width: 450px;
            background: #ffffff;
            padding: 30px;
            border-radius: 18px;
            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .customer-auth-logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .customer-auth-logo h1 {
            margin: 0;
            font-size: 34px;
            letter-spacing: 3px;
        }

        .customer-auth-logo p {
            margin-top: 8px;
            color: #777;
        }

        .customer-auth-card h2 {
            text-align: center;
            margin-bottom: 8px;
        }

        .customer-auth-subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        .customer-auth-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .customer-auth-form label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
        }

        .customer-auth-form input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }

        .customer-auth-form input:focus {
            border-color: #111;
        }

        .customer-auth-form button {
            margin-top: 5px;
            padding: 14px 16px;
            border: none;
            border-radius: 10px;
            background: #111;
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .customer-auth-form button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .customer-auth-message {
            min-height: 22px;
            margin-top: 15px;
            text-align: center;
            font-weight: 600;
        }

        .customer-auth-links {
            margin-top: 20px;
            text-align: center;
            color: #666;
        }

        .customer-auth-links a {
            color: #111;
            font-weight: 600;
            text-decoration: none;
        }

    </style>

</head>


<body>


<div class="customer-auth-page">


    <div class="customer-auth-card">


        <div class="customer-auth-logo">

            <h1>NOORSLOT</h1>

            <p>
                FIND. BOOK. GROOM.
            </p>

        </div>


        <h2>
            Customer Login
        </h2>


        <p class="customer-auth-subtitle">

            Login to manage your bookings.

        </p>


        <form
            id="customerLoginForm"
            class="customer-auth-form"
        >


            <div>

                <label for="phone">
                    Phone Number
                </label>

                <input
                    id="phone"
                    type="tel"
                    inputmode="numeric"
                    maxlength="10"
                    placeholder="10-digit mobile number"
                    autocomplete="tel"
                    required
                >

            </div>


            <div>

                <label for="password">
                    Password
                </label>

                <input
                    id="password"
                    type="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button
                id="loginButton"
                type="submit"
            >
                Login
            </button>


        </form>


        <div
            id="loginMessage"
            class="customer-auth-message"
        ></div>


        <div class="customer-auth-links">

            Don't have an account?

            <a href="customer-signup.html">
                Create Account
            </a>

            <br>
            <br>

            <a href="index.html">
                Continue as Guest
            </a>

        </div>


    </div>


</div>



<script>

const API_BASE_URL =
    "https://yewl.onrender.com";


const form =
    document.getElementById(
        "customerLoginForm"
    );


const loginButton =
    document.getElementById(
        "loginButton"
    );


const message =
    document.getElementById(
        "loginMessage"
    );



form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const phone =
            document
                .getElementById("phone")
                .value
                .trim();


        const password =
            document
                .getElementById("password")
                .value;


        message.textContent = "";


        if (!/^[0-9]{10}$/.test(phone)) {

            message.textContent =
                "Please enter a valid 10-digit phone number.";

            message.style.color =
                "#d93025";

            return;
        }


        if (password.length < 6) {

            message.textContent =
                "Password must be at least 6 characters.";

            message.style.color =
                "#d93025";

            return;
        }


        loginButton.disabled =
            true;

        loginButton.textContent =
            "Logging in...";


        message.textContent =
            "Please wait...";

        message.style.color =
            "#555";


        try {

            const response =
                await fetch(
                    `${API_BASE_URL}/api/customers/login`,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            phone: phone,
                            password: password
                        })
                    }
                );


            const data =
                await response.json();


            if (
                !response.ok ||
                !data.success
            ) {

                throw new Error(
                    data.message ||
                    "Login failed."
                );

            }


            localStorage.setItem(
                "customerToken",
                data.token
            );


            localStorage.setItem(
                "customerData",
                JSON.stringify(
                    data.customer
                )
            );


            message.textContent =
                "Login successful! Redirecting...";

            message.style.color =
                "green";


            setTimeout(
                function() {

                    window.location.href =
                        "customer-dashboard.html";

                },
                1000
            );


        } catch (error) {

            console.error(
                "Customer login error:",
                error
            );


            message.textContent =
                error.message ||
                "Unable to login.";


            message.style.color =
                "#d93025";


            loginButton.disabled =
                false;

            loginButton.textContent =
                "Login";
        }

    }
);

</script>


</body>

</html>
