<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Provider Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.12);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #111;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #333;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1>Provider Login</h1>

        <p class="subtitle">
            Login to manage your services and bookings
        </p>

        <form id="providerLoginForm">

            <label for="phone">Phone Number</label>

            <input
                type="tel"
                id="phone"
                placeholder="Enter phone number"
                required
            >

            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <p id="message"></p>

    </div>

    <script>

        const API_BASE_URL = "https://yewl.onrender.com";

        const form = document.getElementById("providerLoginForm");
        const message = document.getElementById("message");

        form.addEventListener("submit", async function(event) {

            event.preventDefault();

            const phone = document.getElementById("phone").value.trim();
            const password = document.getElementById("password").value;

            message.textContent = "Logging in...";

            try {

                const response = await fetch(
                    `${API_BASE_URL}/api/providers/login`,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            phone,
                            password
                        })
                    }
                );

                const data = await response.json();

                if (!response.ok) {
                    message.textContent = data.message || "Login failed.";
                    return;
                }

                // Save provider login information
                localStorage.setItem(
                    "providerToken",
                    data.token
                );

                localStorage.setItem(
                    "providerData",
                    JSON.stringify(data.provider)
                );

                message.textContent = "Login successful!";

                // Dashboard will be created next
                setTimeout(() => {
                    window.location.href = "provider-dashboard.html";
                }, 800);

            } catch (error) {

                console.error(error);

                message.textContent =
                    "Unable to connect to server.";

            }

        });

    </script>

</body>
</html>
