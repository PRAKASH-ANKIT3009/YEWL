<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NOORSLOT - Customer Signup</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #f7f7f7,
                    #eeeeee
                );

        }


        .signup-container {

            width: 100%;

            max-width: 430px;

            background: #ffffff;

            padding: 35px;

            border-radius: 18px;

            box-shadow:
                0 10px 35px
                rgba(0, 0, 0, 0.10);

        }


        .logo {

            text-align: center;

            font-size: 30px;

            font-weight: 800;

            letter-spacing: 2px;

            color: #111;

            margin-bottom: 8px;

        }


        .tagline {

            text-align: center;

            color: #777;

            font-size: 13px;

            margin-bottom: 30px;

        }


        h2 {

            text-align: center;

            margin-bottom: 25px;

            color: #222;

        }


        .form-group {

            margin-bottom: 17px;

        }


        label {

            display: block;

            margin-bottom: 7px;

            font-size: 14px;

            font-weight: 600;

            color: #333;

        }


        input {

            width: 100%;

            padding: 13px 14px;

            border: 1px solid #ddd;

            border-radius: 9px;

            font-size: 15px;

            outline: none;

        }


        input:focus {

            border-color: #111;

        }


        button {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 9px;

            background: #111;

            color: #fff;

            font-size: 16px;

            font-weight: 600;

            cursor: pointer;

            margin-top: 8px;

        }


        button:hover {

            opacity: 0.9;

        }


        button:disabled {

            opacity: 0.6;

            cursor: not-allowed;

        }


        #message {

            margin-top: 18px;

            text-align: center;

            font-size: 14px;

            line-height: 1.5;

        }


        .login-link {

            margin-top: 22px;

            text-align: center;

            font-size: 14px;

            color: #666;

        }


        .login-link a {

            color: #111;

            font-weight: 600;

            text-decoration: none;

        }


        @media (max-width: 480px) {

            .signup-container {

                padding: 25px 20px;

            }

        }

    </style>

</head>


<body>


    <div class="signup-container">


        <div class="logo">
            NOORSLOT
        </div>


        <div class="tagline">
            FIND. BOOK. GROOM.
        </div>


        <h2>
            Create Customer Account
        </h2>


        <form id="signupForm">


            <!-- NAME -->

            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    required
                >

            </div>


            <!-- PHONE -->

            <div class="form-group">

                <label for="phone">
                    Phone Number
                </label>

                <input
                    type="tel"
                    id="phone"
                    placeholder="10-digit mobile number"
                    maxlength="10"
                    inputmode="numeric"
                    required
                >

            </div>


            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Minimum 6 characters"
                    required
                >

            </div>


            <!-- CONFIRM PASSWORD -->

            <div class="form-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Re-enter your password"
                    required
                >

            </div>


            <button
                type="submit"
                id="signupButton"
            >
                Create Account
            </button>


        </form>


        <div id="message"></div>


        <div class="login-link">

            Already have an account?

            <a href="customer-login.html">
                Login
            </a>

        </div>


    </div>


    <script>

        const API_BASE_URL =
            "https://yewl.onrender.com";


        const signupForm =
            document.getElementById(
                "signupForm"
            );


        const signupButton =
            document.getElementById(
                "signupButton"
            );


        const message =
            document.getElementById(
                "message"
            );


        signupForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                const name =
                    document
                        .getElementById("name")
                        .value
                        .trim();


                const phone =
                    document
                        .getElementById("phone")
                        .value
                        .trim();


                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim()
                        .toLowerCase();


                const password =
                    document
                        .getElementById("password")
                        .value;


                const confirmPassword =
                    document
                        .getElementById(
                            "confirmPassword"
                        )
                        .value;


                // ===============================
                // FRONTEND VALIDATION
                // ===============================


                if (name.length < 2) {

                    showMessage(
                        "Please enter your full name.",
                        "red"
                    );

                    return;

                }


                if (!/^[0-9]{10}$/.test(phone)) {

                    showMessage(
                        "Please enter a valid 10-digit phone number.",
                        "red"
                    );

                    return;

                }


                if (password.length < 6) {

                    showMessage(
                        "Password must be at least 6 characters.",
                        "red"
                    );

                    return;

                }


                if (
                    password !==
                    confirmPassword
                ) {

                    showMessage(
                        "Passwords do not match.",
                        "red"
                    );

                    return;

                }


                // ===============================
                // DISABLE BUTTON
                // ===============================

                signupButton.disabled =
                    true;

                signupButton.textContent =
                    "Creating Account...";


                showMessage(
                    "Creating your account...",
                    "#555"
                );


                try {


                    const response =
                        await fetch(
                            `${API_BASE_URL}/api/customers/signup`,
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify({
                                        name,
                                        phone,
                                        email,
                                        password
                                    })
                            }
                        );


                    const data =
                        await response.json();


                    if (
                        !response.ok ||
                        !data.success
                    ) {

                        throw new Error(
                            data.message ||
                            "Signup failed."
                        );

                    }


                    // ===============================
                    // SUCCESS
                    // ===============================

                    showMessage(
                        "Account created successfully! Redirecting to login...",
                        "green"
                    );


                    signupForm.reset();


                    setTimeout(
                        function () {

                            window.location.href =
                                "customer-login.html";

                        },
                        1500
                    );


                } catch (error) {


                    console.error(
                        "Customer signup error:",
                        error
                    );


                    showMessage(
                        error.message ||
                        "Unable to create account.",
                        "red"
                    );


                    signupButton.disabled =
                        false;

                    signupButton.textContent =
                        "Create Account";

                }

            }
        );


        function showMessage(
            text,
            color
        ) {

            message.textContent =
                text;

            message.style.color =
                color;

        }

    </script>


</body>

</html>
